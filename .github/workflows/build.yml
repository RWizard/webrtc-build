name: build-catalyst

# Сборка LiveKitWebRTC (с префиксом LK) только под Mac Catalyst из нашего форка RWizard/webrtc.
# Запуск вручную: commitHash — коммит форка; releaseTag — если задан, готовый zip кладётся в релиз этого репозитория.
on:
  workflow_dispatch:
    inputs:
      commitHash:
        description: 'коммит RWizard/webrtc'
        required: true
        default: ''
      configuration:
        description: 'build configuration'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      releaseTag:
        description: 'тег релиза для готового zip (пусто — только артефакт сборки)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apple:
    defaults:
      run:
        working-directory: ./build
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v5
    - name: Select Xcode 26.0
      run: sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
    - name: Build
      id: build
      run: ./build.apple_prefixed.sh "${{ github.event.inputs.commitHash }}" "${{ github.event.inputs.configuration }}"
    - name: Checksum
      run: shasum -a 256 _package/apple_prefixed/*.xcframework.zip
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.build.outputs.framework_name }}.xcframework.zip
        path: build/_package/apple_prefixed/${{ steps.build.outputs.framework_name }}.xcframework.zip
    - name: Release
      if: ${{ github.event.inputs.releaseTag != '' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.event.inputs.releaseTag }}
        COMMIT: ${{ github.event.inputs.commitHash }}
      run: |
        gh release create "$TAG" "_package/apple_prefixed/${{ steps.build.outputs.framework_name }}.xcframework.zip" \
          --repo "$GITHUB_REPOSITORY" --title "$TAG" \
          --notes "LiveKitWebRTC для Mac Catalyst из RWizard/webrtc@${COMMIT} (m144_release + webrtc-sdk/webrtc#282)"
